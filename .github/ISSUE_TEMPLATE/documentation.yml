name: Documentation improvement
description: Suggest a correction or missing technical explanation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      description: Which README, guide, protocol, or site page is affected?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is inaccurate, incomplete, or difficult to reproduce.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed correction and evidence
      description: Link to the relevant public source file or reproducible result.
    validations:
      required: true
